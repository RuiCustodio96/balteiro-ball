<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Futebolada dos Amigos</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { border-collapse: collapse; margin-bottom: 30px; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: center; }
    th { background: #f4f4f4; }
  </style>
</head>
<body>

  <h1>⚽ Futebolada Semanal</h1>

  <h2>Classificação das Equipas</h2>
  <table id="teams">
    <thead>
      <tr>
        <th>Equipa</th>
        <th>J</th>
        <th>V</th>
        <th>E</th>
        <th>D</th>
        <th>GM</th>
        <th>GS</th>
        <th>P</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Classificação dos Jogadores</h2>
  <table id="players">
    <thead>
      <tr>
        <th>#</th>
        <th>Jogador</th>
        <th>J</th>
        <th>V</th>
        <th>E</th>
        <th>D</th>
        <th>P</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="app/app.js"></script>
</body>
</html>
